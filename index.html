<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. The primary Meta Refresh Redirect (0 second delay) -->
    <meta http-equiv="refresh" content="0; url=https://github.com/minhduc290613/">
    <title>Page Redirection</title>
    
    <!-- 2. Fallback JavaScript Redirect if Meta refresh fails -->
    <script type="text/javascript">
        window.location.href = "https://github.com/minhduc290613/";
    </script>
</head>
<body>
    <!-- 3. Fallback User Message if both automated methods fail -->
    <p> My Github  
       <a href="https://github.com/minhduc290613/">Github</a>.
    </p>
</body>
</html>
